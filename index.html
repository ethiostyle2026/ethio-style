<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHIO STYLE</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}
header{background:#111;color:white;padding:22px;text-align:center}
header h1{margin:0;color:#f4b400}
nav{text-align:center;background:#222;padding:12px}
nav a{color:white;margin:10px;text-decoration:none}
.hero{text-align:center;padding:35px 15px;background:#eee}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:15px}
.product{background:white;padding:10px;border-radius:10px;text-align:center}
.product img{width:100%;height:150px;object-fit:cover;border-radius:8px}
button{background:#111;color:white;border:0;padding:12px;border-radius:7px}
footer{text-align:center;background:#111;color:white;padding:20px}
</style>
</head>
<body>
<header>
<h1>ETHIO STYLE</h1>
<p>Fashion for Everyone</p>
</header>
<nav>
<a href="#men">ወንዶች</a>
<a href="#women">ሴቶች</a>
<a href="#shoes">ጫማ</a>
</nav>
<div class="hero">
<h2>እንኳን ወደ ETHIO STYLE በደህና መጡ!</h2>
<p>የሚወዱትን ልብስና ጫማ በቀላሉ ይምረጡ።</p>
</div>
<section class="products" id="men">
<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="T-shirt">
<h3>የወንዶች T-Shirt</h3>
<p>800 ብር</p>
<button>ተመልከት</button>
</div>
<div class="product" id="women">
<img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500" alt="Dress">
<h3>የሴቶች ልብስ</h3>
<p>1,500 ብር</p>
<button>ተመልከት</button>
</div>
<div class="product" id="shoes">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
<h3>ጫማ</h3>
<p>2,000 ብር</p>
<button>ተመልከት</button>
</div>
</section>
<footer>
<p>ETHIO STYLE © 2026</p>
<p>ለትዕዛዝ ያግኙን</p>
<p>0968739772</p>
</footer>
</body>
</html>
